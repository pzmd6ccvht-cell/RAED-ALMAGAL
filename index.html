<script>
  const carImages = {
    1: [
      "IMG_7370.jpeg"
    ],

    2: [
      "IMG_7369.jpeg"
    ],

    3: [
      "IMG_7368.jpeg"
    ]
  };

  const currentImage = {
    1: 0,
    2: 0,
    3: 0
  };

  function changeImage(carNumber, direction) {
    const images = carImages[carNumber];

    if (images.length <= 1) {
      return;
    }

    currentImage[carNumber] += direction;

    if (currentImage[carNumber] < 0) {
      currentImage[carNumber] = images.length - 1;
    }

    if (currentImage[carNumber] >= images.length) {
      currentImage[carNumber] = 0;
    }

    document.getElementById(
      "car" + carNumber + "-image"
    ).src = images[currentImage[carNumber]];

    document.getElementById(
      "counter" + carNumber
    ).textContent =
      (currentImage[carNumber] + 1) + " / " + images.length;
  }
</script>
